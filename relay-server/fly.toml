# Ejemplo para Fly.io (cambia "app" por un nombre único): fly launch --no-deploy --copy-config  &&  fly deploy
app = "backrooms-relay-CAMBIAME"
primary_region = "mad"

[build]

[env]
  PORT = "7780"

# TCP crudo (no HTTP): el juego se conecta a  <app>.fly.dev:7780
[[services]]
  protocol = "tcp"
  internal_port = 7780
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7780

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "3s"
